<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>星图查询工具</title>
  <style>
    :root { --panel-width: 380px; }
    body { margin: 0; font-family: Arial, sans-serif; background: #101722; color: #e6edf3; }
    body.resizing { user-select: none; cursor: col-resize; }
    .layout { display: flex; gap: 0; height: 100vh; padding: 12px; box-sizing: border-box; }
    .panel {
      width: var(--panel-width);
      min-width: 280px;
      max-width: 62vw;
      background: #161f2d;
      border: 1px solid #2b3a55;
      border-radius: 8px;
      padding: 10px;
      overflow: auto;
      box-sizing: border-box;
    }
    .resizer {
      width: 10px;
      margin: 0 6px;
      border-radius: 6px;
      cursor: col-resize;
      background: linear-gradient(180deg, #1d2d45, #152337);
      border: 1px solid #2b3a55;
      position: relative;
      flex: 0 0 auto;
    }
    .resizer::before {
      content: "";
      position: absolute;
      inset: 0;
      margin: auto;
      width: 2px;
      height: 36px;
      background: #6f8fb6;
      box-shadow: -3px 0 0 #3a5277, 3px 0 0 #3a5277;
      border-radius: 2px;
    }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
    .row.full { grid-template-columns: 1fr; }
    label { font-size: 12px; color: #9fb3c8; display: block; margin-bottom: 2px; }
    input { width: 100%; box-sizing: border-box; padding: 6px; border-radius: 6px; border: 1px solid #334a6f; background: #0f1622; color: #f0f6fc; }
    button { padding: 8px 10px; border: 1px solid #365a8a; border-radius: 6px; background: #183252; color: #fff; cursor: pointer; }
    button:hover { background: #1f4069; }
    .status { font-size: 12px; white-space: pre-wrap; line-height: 1.4; }
    .canvas-wrap {
      position: relative;
      background: #090d14;
      border-radius: 8px;
      border: 1px solid #273246;
      height: calc(100vh - 24px);
      overflow: auto;
      flex: 1 1 auto;
      min-width: 320px;
    }
    .watermark {
      position: absolute;
      right: 14px;
      bottom: 10px;
      color: rgba(255, 255, 255, 0.28);
      font-size: 16px;
      letter-spacing: 0.5px;
      pointer-events: none;
      user-select: none;
      text-shadow: 0 0 2px rgba(0, 0, 0, 0.5);
      z-index: 5;
      white-space: nowrap;
    }
    .canvas-wrap.panning { cursor: grabbing; }
    .hist-wrap {
      margin-top: 8px;
      border: 1px solid #334a6f;
      border-radius: 6px;
      background: #0f1622;
      padding: 6px;
    }
    #magHistCanvas {
      width: 100%;
      height: 180px;
      display: block;
      background: #0a1019;
      border-radius: 4px;
    }
    .hist-info { margin-top: 4px; font-size: 12px; color: #9fb3c8; }
    canvas { display: block; background: #000; transform-origin: top left; }
    .legend { margin: 6px 0; font-size: 12px; color: #9fb3c8; }
    .hover-box { margin-top: 8px; font-size: 12px; line-height: 1.5; color: #d8e7f5; }
    .calc-box {
      margin: 6px 0 10px;
      padding: 8px;
      border: 1px solid #334a6f;
      border-radius: 6px;
      background: #101a2a;
      font-size: 12px;
      line-height: 1.5;
      color: #c8d7e8;
    }
    .calc-box b { color: #e6edf3; }
    .mini-btn {
      margin-top: 6px;
      width: 100%;
      padding: 6px 8px;
      font-size: 12px;
    }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { border: 1px solid #334a6f; padding: 4px; text-align: right; }
    th { background: #1b2d48; position: sticky; top: 0; }
    .warn { color: #f8d66d; }
    .err { color: #ff7b72; }
    .ok { color: #7ee787; }
  </style>
</head>
<body>
<div class="layout">
  <div class="panel" id="leftPanel">
    <p class="warn">默认 demo 为人工合成演示，非真实星空。真实查询请切换星表路径。</p>
    <h3 style="margin: 4px 0 8px;">星图查询参数</h3>
    <div class="row full">
      <div>
        <label>星表路径 catalog_path</label>
        <input id="catalog_path" value="local_data/starcatalogs/simplified/demo/res5/mag15.0/epoch2000.0/" />
      </div>
    </div>
    <div class="row">
      <div><label>分辨率 h</label><input id="h" type="number" value="1024" /></div>
      <div><label>分辨率 w</label><input id="w" type="number" value="1024" /></div>
    </div>
    <div class="row">
      <div><label>dh_angle (度/像素)</label><input id="dh_angle" type="number" step="0.000001" value="0.0098" /></div>
      <div><label>dw_angle (度/像素)</label><input id="dw_angle" type="number" step="0.000001" value="0.0098" /></div>
    </div>
    <div class="calc-box" id="fovCalcBox">
      <div>h 张角: <b id="hFovDeg">-</b> 度</div>
      <div>w 张角: <b id="wFovDeg">-</b> 度</div>
      <div>对角线张角: <b id="diagFovDeg">-</b> 度</div>
      <div>对角线半径(最小搜索半径阈值): <b id="diagHalfDeg">-</b> 度</div>
      <div id="searchRadiusHint">搜索半径建议: -</div>
      <button id="btnUseSuggestedRadius" class="mini-btn">将建议值填入 search_radius</button>
    </div>
    <div class="row">
      <div><label>中心 RA (度)</label><input id="ra" type="number" step="0.0001" value="90" /></div>
      <div><label>中心 DEC (度)</label><input id="dec" type="number" step="0.0001" value="0" /></div>
    </div>
    <div class="row">
      <div><label>搜索半径 search_radius (度)</label><input id="search_radius" type="number" step="0.01" value="10" /></div>
      <div><label>可见星等 Mag</label><input id="mag" type="number" step="0.1" value="15.0" /></div>
    </div>
    <div class="row">
      <div><label>输出上限 max_count（留空=不限制，支持滚轮）</label><input id="max_count" type="number" min="1" value="" placeholder="留空表示不限制" /></div>
      <div><label>旋转 theta (度)</label><input id="theta" type="number" step="0.1" value="0" /></div>
    </div>
    <div class="row">
      <div><label>平移 dx (像素)</label><input id="dx" type="number" step="0.1" value="0" /></div>
      <div><label>平移 dy (像素)</label><input id="dy" type="number" step="0.1" value="0" /></div>
    </div>
    <div class="row">
      <button id="btnQuery">查询并绘制</button>
      <button id="btnExportAll">导出全部 CSV</button>
    </div>
    <div class="row">
      <button id="btnExportSel">导出框选 CSV</button>
      <button id="btnClearSel">清空选择</button>
    </div>
    <div class="row">
      <div><label>显示星等下限 mag_min（留空=不限制）</label><input id="mag_min_display" type="number" step="0.1" value="" /></div>
      <div><label>显示星等上限 mag_max（留空=不限制）</label><input id="mag_max_display" type="number" step="0.1" value="" /></div>
    </div>
    <div class="row">
      <button id="btnApplyMagFilter">应用星等显示区间</button>
      <button id="btnResetMagFilter">重置星等筛选</button>
    </div>

    <div class="legend">
      颜色规则: 亮星 -> 红色, 中等 -> 白色, 暗星 -> 灰色（点大小固定）<br />
      平移视图: 鼠标中键拖动 / 右键拖动 / Alt+左键拖动
    </div>
    <div class="status" id="status"></div>
    <div class="hover-box" id="hoverInfo">悬浮信息: -</div>
    <h4>星等分布柱状图</h4>
    <div class="hist-wrap">
      <canvas id="magHistCanvas"></canvas>
      <div class="hist-info" id="magHistInfo">暂无数据</div>
    </div>
    <h4>最近恒星列表</h4>
    <div style="max-height: 38vh; overflow:auto;">
      <table id="starTable">
        <thead>
          <tr><th>ID</th><th>RA</th><th>DEC</th><th>MAG</th><th>DIST</th><th>X</th><th>Y</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <div class="resizer" id="panelResizer" title="拖动以调整左栏宽度"></div>

  <div class="canvas-wrap" id="canvasWrap">
    <canvas id="canvas"></canvas>
    <div class="watermark">StarMatch Vis Tools</div>
  </div>
</div>

<script>
const formKeys = ["catalog_path","h","w","dh_angle","dw_angle","ra","dec","search_radius","mag","max_count","theta","dx","dy"];
const PARAMS_LS_KEY = "starmatch_vis_tools_params_v1";
const statusEl = document.getElementById("status");
const hoverInfoEl = document.getElementById("hoverInfo");
const tableBody = document.querySelector("#starTable tbody");
const leftPanel = document.getElementById("leftPanel");
const panelResizer = document.getElementById("panelResizer");
const canvasWrap = document.getElementById("canvasWrap");
const hFovDegEl = document.getElementById("hFovDeg");
const wFovDegEl = document.getElementById("wFovDeg");
const diagFovDegEl = document.getElementById("diagFovDeg");
const diagHalfDegEl = document.getElementById("diagHalfDeg");
const searchRadiusHintEl = document.getElementById("searchRadiusHint");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const magHistCanvas = document.getElementById("magHistCanvas");
const magHistCtx = magHistCanvas.getContext("2d");
const magHistInfoEl = document.getElementById("magHistInfo");
const magMinDisplayEl = document.getElementById("mag_min_display");
const magMaxDisplayEl = document.getElementById("mag_max_display");
let stars = [];
let allStars = [];
let selectedIds = new Set();
let hoverIdx = -1;
let dragStart = null;
let dragEnd = null;
let isDragging = false;
let isPanning = false;
let panStartClientX = 0;
let panStartClientY = 0;
let panStartScrollLeft = 0;
let panStartScrollTop = 0;
let viewOffsetX = 0;
let viewOffsetY = 0;
let fitScale = 1;
let userScale = 1;
const MIN_USER_SCALE = 0.2;
const MAX_USER_SCALE = 8;
const MIN_PANEL_WIDTH = 280;
const MAX_PANEL_WIDTH_RATIO = 0.62;
const HIST_BIN_SIZE = 0.5;
let histData = null;
let histViewMin = null;
let histViewMax = null;
let selectedHistBin = -1;
let isHistPanning = false;
let histPanStartClientX = 0;
let histPanStartViewMin = 0;
let histPanStartViewMax = 0;

function clampPanelWidth(px) {
  const layout = document.querySelector(".layout");
  const maxByRatio = Math.floor(layout.clientWidth * MAX_PANEL_WIDTH_RATIO);
  const maxAllowed = Math.max(MIN_PANEL_WIDTH + 20, maxByRatio);
  return Math.max(MIN_PANEL_WIDTH, Math.min(maxAllowed, Math.round(px)));
}

function applyPanelWidth(px, persist = false) {
  const width = clampPanelWidth(px);
  document.documentElement.style.setProperty("--panel-width", `${width}px`);
  if (persist) localStorage.setItem("star_panel_width", String(width));
}

function currentScale() {
  return fitScale * userScale;
}

function updateCanvasCssSize() {
  const scale = currentScale();
  canvas.style.width = `${Math.max(1, canvas.width * scale)}px`;
  canvas.style.height = `${Math.max(1, canvas.height * scale)}px`;
}

function recomputeFitScale() {
  const w = Math.max(1, canvas.width || Number(document.getElementById("w").value) || 1);
  const h = Math.max(1, canvas.height || Number(document.getElementById("h").value) || 1);
  const wrapW = Math.max(1, canvasWrap.clientWidth - 8);
  const wrapH = Math.max(1, canvasWrap.clientHeight - 8);
  fitScale = Math.min(1, wrapW / w, wrapH / h);
}

function resetViewportFit() {
  userScale = 1;
  recomputeFitScale();
  updateCanvasCssSize();
  canvasWrap.scrollLeft = 0;
  canvasWrap.scrollTop = 0;
}

(function initPanelWidth() {
  const saved = Number(localStorage.getItem("star_panel_width"));
  const initial = Number.isFinite(saved) && saved > 0 ? saved : leftPanel.getBoundingClientRect().width;
  applyPanelWidth(initial, false);
})();

let isResizingPanel = false;
let resizeStartX = 0;
let resizeStartWidth = 0;

panelResizer.addEventListener("mousedown", (e) => {
  isResizingPanel = true;
  resizeStartX = e.clientX;
  resizeStartWidth = leftPanel.getBoundingClientRect().width;
  document.body.classList.add("resizing");
  e.preventDefault();
});

window.addEventListener("mousemove", (e) => {
  if (!isResizingPanel) return;
  const deltaX = e.clientX - resizeStartX;
  applyPanelWidth(resizeStartWidth + deltaX, false);
  recomputeFitScale();
  updateCanvasCssSize();
});

window.addEventListener("mouseup", () => {
  if (!isResizingPanel) return;
  isResizingPanel = false;
  document.body.classList.remove("resizing");
  applyPanelWidth(leftPanel.getBoundingClientRect().width, true);
});

window.addEventListener("mouseup", () => {
  if (!isPanning) return;
  isPanning = false;
  canvasWrap.classList.remove("panning");
});

function getCanvasCoords(e) {
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / Math.max(1, rect.width);
  const scaleY = canvas.height / Math.max(1, rect.height);
  return {
    x: (e.clientX - rect.left) * scaleX - viewOffsetX,
    y: (e.clientY - rect.top) * scaleY - viewOffsetY
  };
}

function readPayload() {
  const p = {};
  for (const k of formKeys) p[k] = document.getElementById(k).value;
  return p;
}

function applyPayload(p) {
  if (!p || typeof p !== "object") return;
  for (const k of formKeys) {
    if (!(k in p)) continue;
    const el = document.getElementById(k);
    if (!el) continue;
    const v = p[k];
    el.value = v === null || v === undefined ? "" : String(v);
  }
}

function saveParamsToLocalStorage() {
  try {
    localStorage.setItem(PARAMS_LS_KEY, JSON.stringify(readPayload()));
  } catch (_) {}
}

async function loadParamsOnStartup() {
  // 优先后端持久化（换浏览器/清缓存也能恢复）；失败再用本地缓存
  try {
    const res = await fetch("/api/params", { method: "GET" });
    const data = await res.json();
    if (res.ok && data && data.ok && data.params && typeof data.params === "object") {
      applyPayload(data.params);
      updateFovCalcUi();
      return;
    }
  } catch (_) {}
  try {
    const raw = localStorage.getItem(PARAMS_LS_KEY);
    if (raw) applyPayload(JSON.parse(raw));
  } catch (_) {}
  updateFovCalcUi();
}

function getCameraMetrics() {
  const h = Number(document.getElementById("h").value);
  const w = Number(document.getElementById("w").value);
  const dh = Number(document.getElementById("dh_angle").value);
  const dw = Number(document.getElementById("dw_angle").value);
  if (!(h > 0 && w > 0 && dh > 0 && dw > 0)) return null;
  const hFov = h * dh;
  const wFov = w * dw;
  const diagFov = Math.hypot(hFov, wFov);
  const diagHalf = diagFov / 2;
  // 后端要求 search_radius > diag_half，给一点安全裕量
  const suggested = diagHalf + 0.02;
  return { hFov, wFov, diagFov, diagHalf, suggested };
}

function updateFovCalcUi() {
  const m = getCameraMetrics();
  const searchRadius = Number(document.getElementById("search_radius").value);
  if (!m) {
    hFovDegEl.textContent = "-";
    wFovDegEl.textContent = "-";
    diagFovDegEl.textContent = "-";
    diagHalfDegEl.textContent = "-";
    searchRadiusHintEl.textContent = "搜索半径建议: 请输入有效的 h/w 与 度/像素";
    searchRadiusHintEl.className = "warn";
    return;
  }
  hFovDegEl.textContent = m.hFov.toFixed(4);
  wFovDegEl.textContent = m.wFov.toFixed(4);
  diagFovDegEl.textContent = m.diagFov.toFixed(4);
  diagHalfDegEl.textContent = m.diagHalf.toFixed(4);

  const suggestedText = m.suggested.toFixed(4);
  if (Number.isFinite(searchRadius) && searchRadius > m.diagHalf) {
    searchRadiusHintEl.textContent = `搜索半径当前可用（> ${m.diagHalf.toFixed(4)}），建议值: ${suggestedText} 度`;
    searchRadiusHintEl.className = "ok";
  } else {
    searchRadiusHintEl.textContent = `搜索半径过小，需 > ${m.diagHalf.toFixed(4)}，建议填入: ${suggestedText} 度`;
    searchRadiusHintEl.className = "warn";
  }
}

function setStatus(text, cls = "") {
  statusEl.className = "status " + cls;
  statusEl.textContent = text;
}

function getOverlayGeometry() {
  const h = Number(document.getElementById("h").value);
  const w = Number(document.getElementById("w").value);
  const dxVal = Number(document.getElementById("dx").value) || 0;
  const dyVal = Number(document.getElementById("dy").value) || 0;
  const dhAngle = Number(document.getElementById("dh_angle").value);
  const dwAngle = Number(document.getElementById("dw_angle").value);
  const searchRadius = Number(document.getElementById("search_radius").value);

  const cx = w / 2 + dxVal;
  const cy = h / 2 + dyVal;
  const boxX = cx - w / 2;
  const boxY = cy - h / 2;
  const avgDegPerPx = (dhAngle > 0 && dwAngle > 0) ? (dhAngle + dwAngle) / 2 : NaN;
  const radiusPx = (avgDegPerPx > 0 && searchRadius > 0)
    ? (searchRadius / avgDegPerPx)
    : (Math.hypot(w, h) / 2);

  return { w, h, cx, cy, boxX, boxY, radiusPx };
}

function toScreenX(worldX) {
  return worldX + viewOffsetX;
}

function toScreenY(worldY) {
  return worldY + viewOffsetY;
}

function updateCanvasBounds() {
  const g = getOverlayGeometry();
  const margin = 24;
  let minX = Math.min(g.boxX, g.cx - g.radiusPx);
  let minY = Math.min(g.boxY, g.cy - g.radiusPx);
  let maxX = Math.max(g.boxX + g.w, g.cx + g.radiusPx);
  let maxY = Math.max(g.boxY + g.h, g.cy + g.radiusPx);

  for (const s of stars) {
    if (Number.isFinite(s.x) && Number.isFinite(s.y)) {
      minX = Math.min(minX, s.x - 8);
      minY = Math.min(minY, s.y - 8);
      maxX = Math.max(maxX, s.x + 8);
      maxY = Math.max(maxY, s.y + 8);
    }
  }

  viewOffsetX = -minX + margin;
  viewOffsetY = -minY + margin;
  canvas.width = Math.max(1, Math.ceil(maxX - minX + margin * 2));
  canvas.height = Math.max(1, Math.ceil(maxY - minY + margin * 2));
}

function draw() {
  updateCanvasBounds();
  recomputeFitScale();
  updateCanvasCssSize();
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  for (const s of stars) {
    const sx = toScreenX(s.x);
    const sy = toScreenY(s.y);
    ctx.beginPath();
    ctx.arc(sx, sy, 3, 0, Math.PI * 2);
    ctx.fillStyle = s.color || "#ccc";
    ctx.fill();
    if (selectedIds.has(s.id)) {
      ctx.beginPath();
      ctx.arc(sx, sy, 6, 0, Math.PI * 2);
      ctx.strokeStyle = "#00e5ff";
      ctx.lineWidth = 1.3;
      ctx.stroke();
    }
  }

  if (hoverIdx >= 0 && hoverIdx < stars.length) {
    const s = stars[hoverIdx];
    const sx = toScreenX(s.x);
    const sy = toScreenY(s.y);
    ctx.beginPath();
    ctx.arc(sx, sy, 7, 0, Math.PI * 2);
    ctx.strokeStyle = "#ffe066";
    ctx.lineWidth = 1.6;
    ctx.stroke();
  }

  if (isDragging && dragStart && dragEnd) {
    const x = Math.min(toScreenX(dragStart.x), toScreenX(dragEnd.x));
    const y = Math.min(toScreenY(dragStart.y), toScreenY(dragEnd.y));
    const wv = Math.abs(dragStart.x - dragEnd.x);
    const hv = Math.abs(dragStart.y - dragEnd.y);
    ctx.strokeStyle = "#58a6ff";
    ctx.lineWidth = 1;
    ctx.setLineDash([6, 4]);
    ctx.strokeRect(x, y, wv, hv);
    ctx.setLineDash([]);
  }

  // 叠加可视化基准:
  // 1) 黄色框: 由 w/h 确定，但中心使用参数中的 dx/dy 偏移后中心
  // 2) 绿色圆: 以同一中心，半径由 search_radius 与 度/像素换算
  ctx.save();
  const g = getOverlayGeometry();
  const boxX = toScreenX(g.boxX);
  const boxY = toScreenY(g.boxY);
  ctx.strokeStyle = "#ffe066";
  ctx.lineWidth = 1.4;
  ctx.strokeRect(boxX + 0.5, boxY + 0.5, Math.max(0, g.w - 1), Math.max(0, g.h - 1));

  ctx.beginPath();
  ctx.arc(toScreenX(g.cx), toScreenY(g.cy), g.radiusPx, 0, Math.PI * 2);
  ctx.strokeStyle = "#3ddc84";
  ctx.lineWidth = 1.3;
  ctx.setLineDash([6, 4]);
  ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();
}

function nearestStar(x, y, threshold = 8) {
  let best = -1;
  let bestD = threshold;
  for (let i = 0; i < stars.length; i++) {
    const s = stars[i];
    const d = Math.hypot(s.x - x, s.y - y);
    if (d < bestD) {
      bestD = d;
      best = i;
    }
  }
  return best;
}

function renderTable() {
  tableBody.innerHTML = "";
  for (const s of stars) {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td>${s.id}</td><td>${s.ra.toFixed(6)}</td><td>${s.dec.toFixed(6)}</td><td>${s.mag.toFixed(2)}</td><td>${s.distance_to_center.toFixed(4)}</td><td>${s.x.toFixed(2)}</td><td>${s.y.toFixed(2)}</td>`;
    if (selectedIds.has(s.id)) tr.style.background = "#113f63";
    tableBody.appendChild(tr);
  }
}

function resetHistogramView() {
  histViewMin = null;
  histViewMax = null;
  selectedHistBin = -1;
}

function buildHistogramData() {
  const mags = stars.map((s) => Number(s.mag)).filter((v) => Number.isFinite(v));
  if (!mags.length) return null;
  const minMag = Math.min(...mags);
  const maxMag = Math.max(...mags);
  const start = Math.floor(minMag / HIST_BIN_SIZE) * HIST_BIN_SIZE;
  const end = Math.ceil(maxMag / HIST_BIN_SIZE) * HIST_BIN_SIZE + HIST_BIN_SIZE;
  const binCount = Math.max(1, Math.round((end - start) / HIST_BIN_SIZE));
  const bins = Array.from({ length: binCount }, () => 0);
  for (const m of mags) {
    const idx = Math.min(binCount - 1, Math.max(0, Math.floor((m - start) / HIST_BIN_SIZE)));
    bins[idx] += 1;
  }
  return { mags, minMag, maxMag, start, end, bins, binCount };
}

function renderMagHistogram() {
  const width = Math.max(240, (magHistCanvas.parentElement?.clientWidth || 260) - 12);
  const height = 180;
  magHistCanvas.width = width;
  magHistCanvas.height = height;
  const left = 40;
  const right = 12;
  const top = 10;
  const bottom = 24;
  const plotW = width - left - right;
  const plotH = height - top - bottom;

  magHistCtx.clearRect(0, 0, width, height);
  magHistCtx.fillStyle = "#0a1019";
  magHistCtx.fillRect(0, 0, width, height);

  histData = buildHistogramData();
  if (!histData) {
    magHistCtx.fillStyle = "#9fb3c8";
    magHistCtx.font = "12px Arial";
    magHistCtx.fillText("暂无星等数据", 12, 22);
    magHistInfoEl.textContent = "暂无数据";
    return;
  }

  if (histViewMin === null || histViewMax === null) {
    histViewMin = histData.start;
    histViewMax = histData.end;
  } else {
    histViewMin = Math.max(histData.start, histViewMin);
    histViewMax = Math.min(histData.end, histViewMax);
    if (histViewMax - histViewMin < HIST_BIN_SIZE * 2) {
      histViewMin = histData.start;
      histViewMax = histData.end;
    }
  }

  const visible = [];
  for (let i = 0; i < histData.binCount; i++) {
    const b0 = histData.start + i * HIST_BIN_SIZE;
    const b1 = b0 + HIST_BIN_SIZE;
    if (b1 <= histViewMin || b0 >= histViewMax) continue;
    visible.push({ i, b0, b1, count: histData.bins[i] });
  }
  const visibleMaxCount = Math.max(1, ...visible.map((v) => v.count));
  const viewSpan = Math.max(HIST_BIN_SIZE * 2, histViewMax - histViewMin);

  magHistCtx.strokeStyle = "#365a8a";
  magHistCtx.lineWidth = 1;
  magHistCtx.beginPath();
  magHistCtx.moveTo(left, top);
  magHistCtx.lineTo(left, top + plotH);
  magHistCtx.lineTo(left + plotW, top + plotH);
  magHistCtx.stroke();

  for (const v of visible) {
    const x0 = left + ((v.b0 - histViewMin) / viewSpan) * plotW + 0.5;
    const x1 = left + ((v.b1 - histViewMin) / viewSpan) * plotW - 0.5;
    const barW = Math.max(1, x1 - x0);
    const h = (v.count / visibleMaxCount) * (plotH - 2);
    const y = top + plotH - h;
    magHistCtx.fillStyle = v.i === selectedHistBin ? "#f2cc60" : "#58a6ff";
    magHistCtx.fillRect(x0, y, barW, h);
  }

  magHistCtx.fillStyle = "#9fb3c8";
  magHistCtx.font = "11px Arial";
  magHistCtx.fillText("0", 24, top + plotH + 3);
  magHistCtx.fillText(String(visibleMaxCount), 6, top + 10);
  magHistCtx.fillText(histViewMin.toFixed(1), left, height - 6);
  magHistCtx.fillText(histViewMax.toFixed(1), left + plotW - 28, height - 6);

  const ticks = 4;
  for (let t = 1; t < ticks; t++) {
    const tv = histViewMin + (viewSpan * t) / ticks;
    const tx = left + (plotW * t) / ticks;
    magHistCtx.strokeStyle = "#1e2a3d";
    magHistCtx.beginPath();
    magHistCtx.moveTo(tx, top);
    magHistCtx.lineTo(tx, top + plotH);
    magHistCtx.stroke();
    magHistCtx.fillStyle = "#7388a1";
    magHistCtx.fillText(tv.toFixed(1), tx - 10, height - 6);
  }

  if (selectedHistBin >= 0 && selectedHistBin < histData.binCount) {
    const b0 = histData.start + selectedHistBin * HIST_BIN_SIZE;
    const b1 = b0 + HIST_BIN_SIZE;
    const c = histData.bins[selectedHistBin];
    magHistInfoEl.textContent = `当前显示 ${stars.length} 颗；视图范围 ${histViewMin.toFixed(2)} ~ ${histViewMax.toFixed(2)}；选中柱区间 [${b0.toFixed(2)}, ${b1.toFixed(2)})，计数 ${c}`;
  } else {
    magHistInfoEl.textContent = `当前显示 ${stars.length} 颗；星等范围 ${histData.minMag.toFixed(2)} ~ ${histData.maxMag.toFixed(2)}；视图范围 ${histViewMin.toFixed(2)} ~ ${histViewMax.toFixed(2)}`;
  }
}

function applyMagFilter() {
  const minText = magMinDisplayEl.value.trim();
  const maxText = magMaxDisplayEl.value.trim();
  const minMag = minText === "" ? null : Number(minText);
  const maxMag = maxText === "" ? null : Number(maxText);

  if ((minMag !== null && !Number.isFinite(minMag)) || (maxMag !== null && !Number.isFinite(maxMag))) {
    setStatus("星等筛选输入无效，请输入数字或留空", "warn");
    return false;
  }
  if (minMag !== null && maxMag !== null && minMag > maxMag) {
    setStatus("星等筛选区间无效：min 不能大于 max", "warn");
    return false;
  }

  stars = allStars.filter((s) => {
    if (minMag !== null && s.mag < minMag) return false;
    if (maxMag !== null && s.mag > maxMag) return false;
    return true;
  });

  const visibleIds = new Set(stars.map((s) => s.id));
  selectedIds = new Set([...selectedIds].filter((id) => visibleIds.has(id)));
  hoverIdx = -1;
  resetHistogramView();
  draw();
  renderTable();
  renderMagHistogram();
  setStatus(`星等筛选后显示 ${stars.length}/${allStars.length} 颗星`, "ok");
  return true;
}

function updateHoverInfo(idx) {
  if (idx < 0 || idx >= stars.length) {
    hoverInfoEl.textContent = "悬浮信息: -";
    return;
  }
  const s = stars[idx];
  hoverInfoEl.textContent =
    `悬浮信息: ID=${s.id} RA=${s.ra.toFixed(6)} DEC=${s.dec.toFixed(6)} MAG=${s.mag.toFixed(2)} DIST=${s.distance_to_center.toFixed(4)} X=${s.x.toFixed(2)} Y=${s.y.toFixed(2)}`;
}

function exportCsv(rows, filename) {
  if (!rows.length) {
    setStatus("没有可导出的数据", "warn");
    return;
  }
  const cols = ["id", "ra", "dec", "mag", "distance_to_center", "x", "y", "visible_in_frame"];
  const lines = [cols.join(",")];
  for (const r of rows) {
    lines.push(cols.map(c => r[c]).join(","));
  }
  const blob = new Blob([lines.join("\n")], { type: "text/csv;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
}

function isPanMouseEvent(e) {
  return e.button === 1 || e.button === 2 || (e.button === 0 && e.altKey);
}

function histViewSpan() {
  return Math.max(HIST_BIN_SIZE * 2, (histViewMax ?? 0) - (histViewMin ?? 0));
}

function histMagAtClientX(clientX) {
  if (!histData) return null;
  const rect = magHistCanvas.getBoundingClientRect();
  const width = magHistCanvas.width;
  const left = 40;
  const right = 12;
  const plotW = width - left - right;
  const x = ((clientX - rect.left) * width) / Math.max(1, rect.width);
  if (x < left || x > left + plotW) return null;
  const ratio = (x - left) / Math.max(1, plotW);
  return histViewMin + ratio * histViewSpan();
}

function histBinIndexAtClientX(clientX) {
  const mag = histMagAtClientX(clientX);
  if (mag === null || !histData) return -1;
  const idx = Math.floor((mag - histData.start) / HIST_BIN_SIZE);
  if (idx < 0 || idx >= histData.binCount) return -1;
  return idx;
}

magHistCanvas.addEventListener("mousedown", (e) => {
  if (!histData) return;
  if (e.button === 1 || e.button === 2 || (e.button === 0 && e.altKey)) {
    isHistPanning = true;
    histPanStartClientX = e.clientX;
    histPanStartViewMin = histViewMin;
    histPanStartViewMax = histViewMax;
    e.preventDefault();
    return;
  }
  if (e.button !== 0) return;
  const idx = histBinIndexAtClientX(e.clientX);
  selectedHistBin = idx;
  renderMagHistogram();
});

magHistCanvas.addEventListener("mousemove", (e) => {
  if (!isHistPanning || !histData) return;
  const rect = magHistCanvas.getBoundingClientRect();
  const pxDelta = e.clientX - histPanStartClientX;
  const magDelta = (pxDelta / Math.max(1, rect.width)) * histViewSpan();
  const desiredMin = histPanStartViewMin - magDelta;
  const desiredMax = histPanStartViewMax - magDelta;
  const span = desiredMax - desiredMin;
  histViewMin = desiredMin;
  histViewMax = desiredMax;
  if (histViewMin < histData.start) {
    histViewMin = histData.start;
    histViewMax = histViewMin + span;
  }
  if (histViewMax > histData.end) {
    histViewMax = histData.end;
    histViewMin = histViewMax - span;
  }
  renderMagHistogram();
});

window.addEventListener("mouseup", () => {
  if (!isHistPanning) return;
  isHistPanning = false;
});

magHistCanvas.addEventListener("wheel", (e) => {
  if (!histData) return;
  e.preventDefault();
  const anchor = histMagAtClientX(e.clientX);
  if (anchor === null) return;
  const oldSpan = histViewSpan();
  const zoom = e.deltaY < 0 ? 0.85 : 1.18;
  let newSpan = oldSpan * zoom;
  const minSpan = HIST_BIN_SIZE * 2;
  const maxSpan = histData.end - histData.start;
  newSpan = Math.max(minSpan, Math.min(maxSpan, newSpan));
  const ratio = (anchor - histViewMin) / Math.max(1e-6, oldSpan);
  histViewMin = anchor - ratio * newSpan;
  histViewMax = histViewMin + newSpan;
  if (histViewMin < histData.start) {
    histViewMin = histData.start;
    histViewMax = histViewMin + newSpan;
  }
  if (histViewMax > histData.end) {
    histViewMax = histData.end;
    histViewMin = histViewMax - newSpan;
  }
  renderMagHistogram();
}, { passive: false });

magHistCanvas.addEventListener("dblclick", () => {
  if (!histData) return;
  histViewMin = histData.start;
  histViewMax = histData.end;
  selectedHistBin = -1;
  renderMagHistogram();
});

magHistCanvas.addEventListener("contextmenu", (e) => {
  e.preventDefault();
});

canvas.addEventListener("mousemove", (e) => {
  if (isPanning) {
    const dxMove = e.clientX - panStartClientX;
    const dyMove = e.clientY - panStartClientY;
    canvasWrap.scrollLeft = panStartScrollLeft - dxMove;
    canvasWrap.scrollTop = panStartScrollTop - dyMove;
    return;
  }
  const { x, y } = getCanvasCoords(e);
  hoverIdx = nearestStar(x, y);
  updateHoverInfo(hoverIdx);
  if (isDragging) dragEnd = { x, y };
  draw();
});

canvas.addEventListener("mouseleave", () => {
  hoverIdx = -1;
  updateHoverInfo(-1);
  draw();
});

canvas.addEventListener("mousedown", (e) => {
  if (isPanMouseEvent(e)) {
    isPanning = true;
    panStartClientX = e.clientX;
    panStartClientY = e.clientY;
    panStartScrollLeft = canvasWrap.scrollLeft;
    panStartScrollTop = canvasWrap.scrollTop;
    canvasWrap.classList.add("panning");
    e.preventDefault();
    return;
  }
  if (e.button !== 0) return;
  const { x, y } = getCanvasCoords(e);
  dragStart = { x, y };
  dragEnd = { x, y };
  isDragging = true;
});

canvas.addEventListener("mouseup", () => {
  if (isPanning) {
    isPanning = false;
    canvasWrap.classList.remove("panning");
    return;
  }
  if (!dragStart || !dragEnd) {
    isDragging = false;
    return;
  }
  const wv = Math.abs(dragStart.x - dragEnd.x);
  const hv = Math.abs(dragStart.y - dragEnd.y);
  if (wv < 4 && hv < 4) {
    const idx = nearestStar(dragEnd.x, dragEnd.y);
    if (idx >= 0) {
      const id = stars[idx].id;
      if (selectedIds.has(id)) selectedIds.delete(id);
      else selectedIds.add(id);
    }
  } else {
    const x0 = Math.min(dragStart.x, dragEnd.x);
    const y0 = Math.min(dragStart.y, dragEnd.y);
    const x1 = Math.max(dragStart.x, dragEnd.x);
    const y1 = Math.max(dragStart.y, dragEnd.y);
    for (const s of stars) {
      if (s.x >= x0 && s.x <= x1 && s.y >= y0 && s.y <= y1) selectedIds.add(s.id);
    }
  }
  isDragging = false;
  draw();
  renderTable();
  setStatus(`已选中 ${selectedIds.size} 颗星`, "ok");
});

canvas.addEventListener("contextmenu", (e) => {
  e.preventDefault();
});

document.getElementById("btnClearSel").onclick = () => {
  selectedIds.clear();
  draw();
  renderTable();
  setStatus("已清空选择", "ok");
};

document.getElementById("btnExportAll").onclick = () => {
  exportCsv(stars, "stars_all.csv");
};

document.getElementById("btnExportSel").onclick = () => {
  const rows = stars.filter(s => selectedIds.has(s.id));
  exportCsv(rows, "stars_selected.csv");
};

document.getElementById("btnApplyMagFilter").onclick = () => {
  applyMagFilter();
};

document.getElementById("btnResetMagFilter").onclick = () => {
  magMinDisplayEl.value = "";
  magMaxDisplayEl.value = "";
  stars = allStars.slice();
  selectedIds.clear();
  hoverIdx = -1;
  resetHistogramView();
  draw();
  renderTable();
  renderMagHistogram();
  setStatus(`已重置星等筛选，显示 ${stars.length} 颗星`, "ok");
};

canvasWrap.addEventListener("wheel", (e) => {
  e.preventDefault();
  const delta = e.deltaY < 0 ? 1.1 : 0.9;
  userScale = Math.max(MIN_USER_SCALE, Math.min(MAX_USER_SCALE, userScale * delta));
  updateCanvasCssSize();
  setStatus(`缩放: ${(currentScale() * 100).toFixed(0)}%`, "ok");
}, { passive: false });

document.getElementById("max_count").addEventListener("wheel", (e) => {
  e.preventDefault();
  const input = e.currentTarget;
  const min = Number(input.min || 1);
  const step = Number(input.step || 1);
  let v = Number(input.value || 100);
  v += (e.deltaY < 0 ? step : -step);
  v = Math.max(min, v);
  input.value = String(Math.round(v));
}, { passive: false });

document.getElementById("btnUseSuggestedRadius").onclick = () => {
  const m = getCameraMetrics();
  if (!m) {
    setStatus("请先输入有效的分辨率和度/像素参数", "warn");
    return;
  }
  document.getElementById("search_radius").value = m.suggested.toFixed(4);
  updateFovCalcUi();
  setStatus(`已将建议搜索半径填入为 ${m.suggested.toFixed(4)} 度`, "ok");
};

["h", "w", "dh_angle", "dw_angle", "search_radius"].forEach((id) => {
  document.getElementById(id).addEventListener("input", updateFovCalcUi);
});

window.addEventListener("resize", () => {
  applyPanelWidth(leftPanel.getBoundingClientRect().width, false);
  recomputeFitScale();
  updateCanvasCssSize();
  updateFovCalcUi();
  renderMagHistogram();
});

document.getElementById("btnQuery").onclick = async () => {
  const metrics = getCameraMetrics();
  const searchRadius = Number(document.getElementById("search_radius").value);
  if (!metrics) {
    setStatus("参数无效：请检查 h/w 与 dh_angle/dw_angle（均需 > 0）", "err");
    return;
  }
  if (!(searchRadius > metrics.diagHalf)) {
    setStatus(
      `搜索半径需大于对角线半径 ${metrics.diagHalf.toFixed(4)} 度。可点击“将建议值填入 search_radius”。`,
      "warn"
    );
    return;
  }
  setStatus("查询中...");
  const payload = readPayload();
  saveParamsToLocalStorage();
  try {
    const res = await fetch("/api/query", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (!res.ok || !data.ok) {
      setStatus(data.error || "查询失败", "err");
      return;
    }
    allStars = data.result.stars || [];
    stars = allStars.slice();
    selectedIds.clear();
    hoverIdx = -1;
    applyMagFilter();
    resetViewportFit();
    draw();
    renderTable();
    renderMagHistogram();
    setStatus(
      `查询成功\n星数: ${data.result.count}\n相机对角线半径: ${data.result.diag_half_radius.toFixed(4)} 度\n初始缩放: ${(currentScale() * 100).toFixed(0)}%\n星表路径: ${data.result.catalog_path}`,
      "ok"
    );
  } catch (e) {
    setStatus(`请求失败: ${e}`, "err");
  }
};

resetViewportFit();
loadParamsOnStartup();
draw();
renderMagHistogram();
</script>
</body>
</html>
